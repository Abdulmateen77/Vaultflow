<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaultflow – PII Redaction</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2d3148;
      --accent:    #6366f1;
      --accent-h:  #818cf8;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --danger:    #f43f5e;
      --success:   #10b981;
      --warn:      #f59e0b;
      --info:      #38bdf8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      max-width: 780px;
      margin: 0 auto 32px;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header h1 span { color: var(--accent-h); }

    header p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    nav {
      max-width: 780px;
      margin: 0 auto 18px;
    }

    nav a {
      color: var(--muted);
      font-size: 13px;
      margin-right: 18px;
      text-decoration: none;
    }

    nav a:hover { color: var(--accent-h); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      max-width: 780px;
      margin: 0 auto 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 12px;
      resize: vertical;
      min-height: 160px;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--accent); }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    button#redact-btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 22px;
      transition: background 0.15s, opacity 0.15s;
    }

    button#redact-btn:hover:not(:disabled) { background: var(--accent-h); }
    button#redact-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    button#clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 9px 16px;
      transition: border-color 0.15s, color 0.15s;
    }

    button#clear-btn:hover { border-color: var(--text); color: var(--text); }

    #spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-box {
      display: none;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: 6px;
      color: var(--danger);
      font-size: 13px;
      margin-top: 16px;
      padding: 10px 14px;
    }

    #results { display: none; }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    #redacted-output {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Consolas', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* highlight replaced tokens */
    #redacted-output .tok {
      display: inline-block;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      vertical-align: baseline;
    }

    .tok-EMAIL   { background: rgba(56, 189, 248, 0.18); color: var(--info); }
    .tok-PHONE   { background: rgba(16, 185, 129, 0.18); color: var(--success); }
    .tok-SSN     { background: rgba(244, 63, 94, 0.18);  color: var(--danger); }
    .tok-CC      { background: rgba(245, 158, 11, 0.18); color: var(--warn); }
    .tok-NAME    { background: rgba(99, 102, 241, 0.18); color: var(--accent-h); }
    .tok-ADDRESS { background: rgba(139, 92, 246, 0.18); color: #c084fc; }
    .tok-OTHER   { background: rgba(100, 116, 139, 0.18); color: var(--muted); }

    #detections-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 0;
    }

    .badge {
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      letter-spacing: 0.04em;
    }

    .badge-EMAIL   { background: rgba(56, 189, 248, 0.18); color: var(--info); }
    .badge-PHONE   { background: rgba(16, 185, 129, 0.18); color: var(--success); }
    .badge-SSN     { background: rgba(244, 63, 94, 0.18);  color: var(--danger); }
    .badge-CREDIT_CARD { background: rgba(245, 158, 11, 0.18); color: var(--warn); }
    .badge-NAME    { background: rgba(99, 102, 241, 0.18); color: var(--accent-h); }
    .badge-ADDRESS { background: rgba(139, 92, 246, 0.18); color: #c084fc; }
    .badge-OTHER   { background: rgba(100, 116, 139, 0.18); color: var(--muted); }

    .none-note {
      color: var(--muted);
      font-style: italic;
      font-size: 13px;
    }

    .stats-row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-h);
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <a href="/">Redaction Gateway</a>
    <a href="/api-reference">API Docs</a>
    <a href="/team">Team</a>
  </nav>
  <h1>Vault<span>flow</span></h1>
  <p>Paste text below and click Redact to detect and remove PII.</p>
</header>

<div class="card">
  <label for="input-text">Input text</label>
  <textarea id="input-text" placeholder="Paste any text containing names, emails, phone numbers, SSNs, addresses, or credit cards…"></textarea>

  <div class="btn-row">
    <button id="redact-btn" type="button">Redact PII</button>
    <button id="clear-btn" type="button">Clear</button>
    <div id="spinner"></div>
  </div>

  <div id="error-box"></div>
</div>

<div class="card" id="results">
  <div class="stats-row">
    <div class="stat">
      <div class="stat-val" id="stat-count">0</div>
      <div class="stat-lbl">Detections</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-types">—</div>
      <div class="stat-lbl">PII types</div>
    </div>
  </div>

  <div class="section-title" style="margin-bottom:8px">Redacted output</div>
  <div id="redacted-output"></div>

  <div class="section-title" style="margin-top:20px;margin-bottom:8px">Detected items</div>
  <div id="detections-list"></div>
</div>

<footer>Vaultflow PII Redaction Gateway · MVP</footer>

<script>
  const inputEl  = document.getElementById('input-text');
  const btnRedact = document.getElementById('redact-btn');
  const btnClear  = document.getElementById('clear-btn');
  const spinner   = document.getElementById('spinner');
  const errorBox  = document.getElementById('error-box');
  const resultsEl = document.getElementById('results');
  const outputEl  = document.getElementById('redacted-output');
  const listEl    = document.getElementById('detections-list');
  const statCount = document.getElementById('stat-count');
  const statTypes = document.getElementById('stat-types');

  const TOKEN_CLASS = {
    EMAIL:       'tok-EMAIL',
    PHONE:       'tok-PHONE',
    SSN:         'tok-SSN',
    CREDIT_CARD: 'tok-CC',
    NAME:        'tok-NAME',
    ADDRESS:     'tok-ADDRESS',
  };

  const BADGE_CLASS = {
    EMAIL:       'badge-EMAIL',
    PHONE:       'badge-PHONE',
    SSN:         'badge-SSN',
    CREDIT_CARD: 'badge-CREDIT_CARD',
    NAME:        'badge-NAME',
    ADDRESS:     'badge-ADDRESS',
  };

  function setLoading(on) {
    btnRedact.disabled = on;
    spinner.style.display = on ? 'block' : 'none';
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  /** Build highlighted redacted-text HTML by scanning for placeholder tokens */
  function buildHighlightedHtml(redactedText) {
    const tokenRe = /\[(EMAIL|PHONE|SSN|CREDIT_CARD|NAME|ADDRESS|PII)\]/g;
    let html = '';
    let cursor = 0;
    let match;
    while ((match = tokenRe.exec(redactedText)) !== null) {
      // plain text before token
      html += escHtml(redactedText.slice(cursor, match.index));
      const label = match[1];
      const cls = TOKEN_CLASS[label] || 'tok-OTHER';
      html += `<span class="tok ${cls}">[${label}]</span>`;
      cursor = match.index + match[0].length;
    }
    html += escHtml(redactedText.slice(cursor));
    return html;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  btnRedact.addEventListener('click', async () => {
    const text = inputEl.value.trim();
    if (!text) { showError('Please paste some text first.'); return; }
    hideError();
    setLoading(true);
    resultsEl.style.display = 'none';

    try {
      const res = await fetch('/redact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${res.status}`);
      }

      const data = await res.json();
      renderResults(data);
    } catch (e) {
      showError(e.message || 'Request failed. Is the server running?');
    } finally {
      setLoading(false);
    }
  });

  btnClear.addEventListener('click', () => {
    inputEl.value = '';
    hideError();
    resultsEl.style.display = 'none';
    inputEl.focus();
  });

  function renderResults({ redacted_text, detections }) {
    // Highlighted output
    outputEl.innerHTML = buildHighlightedHtml(redacted_text);

    // Stats
    const count = detections.length;
    statCount.textContent = count;
    const types = [...new Set(detections.map(d => d.type))];
    statTypes.textContent = types.length ? types.join(', ') : '—';

    // Detection badges
    listEl.innerHTML = '';
    if (count === 0) {
      listEl.innerHTML = '<span class="none-note">No PII detected.</span>';
    } else {
      // Group by type for clean display
      const grouped = {};
      for (const d of detections) {
        grouped[d.type] = (grouped[d.type] || 0) + 1;
      }
      for (const [type, n] of Object.entries(grouped)) {
        const cls = BADGE_CLASS[type] || 'badge-OTHER';
        const el = document.createElement('span');
        el.className = `badge ${cls}`;
        el.textContent = `${type} ×${n}`;
        listEl.appendChild(el);
      }
    }

    resultsEl.style.display = 'block';
  }

  // Allow Ctrl+Enter to submit
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btnRedact.click();
  });
</script>
</body>
</html>
